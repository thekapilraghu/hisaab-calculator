<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ब्याज कैलकुलेटर | Byaaj Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#E8EEF5;
  --card:#FFFFFF;
  --hdr:#0F2E56;
  --pri:#0F2E56;
  --pri-lt:#E1EAF5;
  --grn:#145A2E;
  --grn-lt:#D4EFDF;
  --grn-bd:#6FCF97;
  --gld:#7D5100;
  --gld-lt:#FEF3CD;
  --gld-bd:#F4C430;
  --err:#A11919;
  --err-lt:#FDECEA;
  --tx:#1A1F2E;
  --txm:#64748B;
  --bd:#D1DBE8;
  --sh:0 2px 12px rgba(15,46,86,.09);
  --r:12px;
  --rs:8px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;
  background:var(--bg);
  color:var(--tx);
  min-height:100dvh;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,24px);
}

/* ── Header ── */
.hdr{
  background:var(--hdr);
  color:#fff;
  padding:20px 20px 28px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hdr::after{
  content:'';
  position:absolute;
  bottom:-1px;left:0;right:0;
  height:20px;
  background:var(--bg);
  border-radius:24px 24px 0 0;
}
.hdr-icon{font-size:2.4rem;line-height:1;display:block;margin-bottom:8px}
.hdr-title{font-size:1.5rem;font-weight:800;letter-spacing:-.025em}
.hdr-sub{font-size:.78rem;opacity:.65;margin-top:3px;font-weight:400}

/* ── Layout ── */
.wrap{
  max-width:464px;
  margin:0 auto;
  padding:12px 14px 0;
}

/* ── Card ── */
.card{
  background:var(--card);
  border-radius:var(--r);
  box-shadow:var(--sh);
  padding:20px;
  margin-bottom:14px;
}
.card-hd{
  font-size:.65rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--txm);
  border-bottom:1px solid var(--bd);
  padding-bottom:10px;
  margin-bottom:18px;
}

/* ── Form fields ── */
.f{margin-bottom:14px}
.f:last-child{margin-bottom:0}
.f>label{
  display:block;
  font-size:.8rem;
  font-weight:600;
  color:var(--tx);
  margin-bottom:5px;
  line-height:1.3;
}
.f>label em{
  font-style:normal;
  font-size:.71rem;
  font-weight:400;
  color:var(--txm);
  margin-left:3px;
}
.inp-wrap{position:relative}
.px{
  position:absolute;
  left:13px;top:50%;
  transform:translateY(-50%);
  font-size:1rem;font-weight:600;
  color:var(--txm);pointer-events:none;z-index:1;
}
.sx{
  position:absolute;
  right:13px;top:50%;
  transform:translateY(-50%);
  font-size:.95rem;font-weight:700;
  color:var(--txm);pointer-events:none;z-index:1;
}
input{
  display:block;
  width:100%;height:52px;
  border:1.5px solid var(--bd);
  border-radius:var(--rs);
  font-family:'Poppins',sans-serif;
  font-size:16px;font-weight:500;
  color:var(--tx);
  background:#F6F9FD;
  outline:none;
  padding:0 14px;
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s,background .15s;
}
input:focus{border-color:var(--pri);background:#fff}
input.err{border-color:var(--err)!important}
.has-px{padding-left:30px!important}
.has-sx{padding-right:34px!important}
/* Remove number spinners */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
/* Date input color fix */
input[type=date]::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer}

.err-msg{
  display:none;
  color:var(--err);
  font-size:.71rem;font-weight:500;
  margin-top:4px;line-height:1.4;
}
.err-msg.on{display:block}
.sep{height:1px;background:var(--bd);margin:16px 0}

/* ── Toggle ── */
.toggle{
  display:flex;
  background:#EEF2F8;
  border-radius:var(--rs);
  padding:3px;gap:3px;
}
.tbtn{
  flex:1;height:44px;
  border:none;border-radius:6px;
  font-family:'Poppins',sans-serif;
  font-size:.79rem;font-weight:600;
  cursor:pointer;
  color:var(--txm);background:transparent;
  transition:all .14s;
  padding:0 4px;
}
.tbtn.on{
  background:var(--pri);color:#fff;
  box-shadow:0 1px 5px rgba(15,46,86,.22);
}

/* ── Date row ── */
.drow{display:flex;gap:8px;align-items:stretch}
.drow input{flex:1;min-width:0}
.today-btn{
  flex-shrink:0;
  height:52px;padding:0 12px;
  border:1.5px solid var(--pri-lt);
  border-radius:var(--rs);
  background:var(--pri-lt);color:var(--pri);
  font-family:'Poppins',sans-serif;
  font-size:.74rem;font-weight:700;
  cursor:pointer;white-space:nowrap;
  transition:all .14s;
}
.today-btn:active,.today-btn:hover{background:var(--pri);color:#fff;border-color:var(--pri)}

/* ── Mode sections ── */
.msec{display:none}
.msec.on{display:block}

/* ── Action buttons ── */
.btn-row{display:flex;gap:8px}
.btn-calc{
  flex:1;height:54px;
  border:none;border-radius:var(--rs);
  background:var(--grn);color:#fff;
  font-family:'Poppins',sans-serif;
  font-size:1rem;font-weight:700;
  cursor:pointer;letter-spacing:.01em;
  transition:opacity .13s,transform .1s;
}
.btn-calc:active{opacity:.87;transform:scale(.99)}
.btn-rst{
  height:54px;padding:0 16px;
  border:1.5px solid var(--bd);
  border-radius:var(--rs);
  background:transparent;color:var(--txm);
  font-family:'Poppins',sans-serif;
  font-size:.86rem;font-weight:600;
  cursor:pointer;
  transition:background .13s;
}
.btn-rst:active,.btn-rst:hover{background:#EEF2F8}

/* ── Results ── */
.res-card{display:none}
.res-card.on{display:block}

.res-hero{
  background:var(--grn-lt);
  border:1.5px solid var(--grn-bd);
  border-radius:var(--rs);
  padding:18px 16px;
  text-align:center;
  margin-bottom:14px;
}
.res-hero-lbl{
  font-size:.67rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;
  color:var(--grn);margin-bottom:5px;
}
.res-hero-amt{
  font-size:2.4rem;font-weight:800;
  color:var(--grn);letter-spacing:-.03em;
  line-height:1.15;
}

.res-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}
.ri{
  background:#F4F8FD;
  border-radius:var(--rs);
  padding:11px 12px;
}
.ri.full{grid-column:1/-1}
.ri.hi{
  background:var(--gld-lt);
  border:1px solid var(--gld-bd);
}
.ri .rl{
  font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;
  color:var(--txm);margin-bottom:3px;
}
.ri .rv{
  font-size:.9rem;font-weight:700;
  color:var(--tx);line-height:1.2;
}
.ri.hi .rv{color:var(--gld);font-size:1rem}

/* ── Breakdown ── */
.bkd{
  background:#F6F9FD;
  border-left:3px solid var(--pri);
  border-radius:0 var(--rs) var(--rs) 0;
  padding:13px 14px;
  margin-bottom:12px;
}
.bkd-t{
  font-size:.63rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;
  color:var(--pri);margin-bottom:8px;
}
.bkd-l{
  font-size:.78rem;
  color:var(--txm);
  line-height:2;
}
.bkd-l strong{color:var(--tx);font-weight:600}

/* ── Copy button ── */
.btn-copy{
  width:100%;height:46px;
  border:1.5px solid var(--bd);
  border-radius:var(--rs);
  background:#fff;
  font-family:'Poppins',sans-serif;
  font-size:.83rem;font-weight:600;
  color:var(--tx);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .14s;
}
.btn-copy.done{
  background:var(--grn-lt);
  border-color:var(--grn-bd);color:var(--grn);
}
.btn-copy:hover:not(.done){background:#F4F8FD}

/* ── Note ── */
.note{
  text-align:center;
  font-size:.68rem;color:var(--txm);
  padding:10px 0 4px;
  line-height:1.5;
}
</style>
</head>
<body>

<header class="hdr">
  <span class="hdr-icon">🧮</span>
  <div class="hdr-title">ब्याज कैलकुलेटर</div>
  <div class="hdr-sub">Dukaan ke Udhaar ka Byaaj Nikaaliye</div>
</header>

<div class="wrap">

  <!-- ─── Input Card ─────────────────────────────── -->
  <div class="card">
    <div class="card-hd">📝 Udhaar Ki Jaankari / Details</div>

    <!-- Amount -->
    <div class="f">
      <label>Udhaar Ki Rashi <em>/ Principal Amount</em></label>
      <div class="inp-wrap">
        <span class="px">₹</span>
        <input type="text" inputmode="decimal" id="i-amt"
               class="has-px" placeholder="25000" autocomplete="off">
      </div>
      <div class="err-msg" id="e-amt"></div>
    </div>

    <!-- Rate -->
    <div class="f">
      <label>Mahine Ka Byaaj <em>/ Monthly Interest Rate</em></label>
      <div class="inp-wrap">
        <input type="text" inputmode="decimal" id="i-rate"
               class="has-sx" placeholder="2" autocomplete="off">
        <span class="sx">%</span>
      </div>
      <div class="err-msg" id="e-rate"></div>
    </div>

    <div class="sep"></div>

    <!-- Mode Toggle -->
    <div class="f">
      <label>Hisab Ka Tarika <em>/ Calculation Method</em></label>
      <div class="toggle">
        <button class="tbtn on" id="tb-date" onclick="setMode('date')">📅 Tarikh Se</button>
        <button class="tbtn" id="tb-days" onclick="setMode('days')">🗓️ Total Days</button>
      </div>
    </div>

    <!-- Date Mode -->
    <div class="msec on" id="sec-date">
      <div class="f">
        <label>Udhaar Dene Ki Date <em>/ Start Date</em></label>
        <input type="date" id="i-sd" autocomplete="off">
        <div class="err-msg" id="e-sd"></div>
      </div>
      <div class="f">
        <label>Paise Lene Ki Date <em>/ End Date</em></label>
        <div class="drow">
          <input type="date" id="i-ed" autocomplete="off">
          <button class="today-btn" onclick="setToday()">Aaj ✓</button>
        </div>
        <div class="err-msg" id="e-ed"></div>
      </div>
    </div>

    <!-- Days Mode -->
    <div class="msec" id="sec-days">
      <div class="f">
        <label>Total Udhaar Din <em>/ Number of Days</em></label>
        <input type="text" inputmode="decimal" id="i-days"
               placeholder="45" autocomplete="off">
        <div class="err-msg" id="e-days"></div>
      </div>
    </div>

    <div class="sep"></div>

    <div class="btn-row">
      <button class="btn-calc" onclick="doCalc()">✓ Hisab Lagao</button>
      <button class="btn-rst" onclick="doReset()">↺ Reset</button>
    </div>
  </div>

  <!-- ─── Results Card ───────────────────────────── -->
  <div class="card res-card" id="res-card">
    <div class="card-hd">📊 Hisab Ka Nateeja / Result</div>

    <div class="res-hero">
      <div class="res-hero-lbl">Total Rashi — Leni Hai</div>
      <div class="res-hero-amt" id="r-total">₹0</div>
    </div>

    <div class="res-grid" id="r-grid"></div>

    <div class="bkd">
      <div class="bkd-t">📐 Hisab Kaise Hua / Calculation Breakdown</div>
      <div class="bkd-l" id="r-bkd"></div>
    </div>

    <button class="btn-copy" id="btn-copy" onclick="doCopy()">
      <span id="cp-icon">📋</span>
      <span id="cp-txt">WhatsApp / SMS ke liye Copy Karen</span>
    </button>
  </div>

  <p class="note">
    💡 Mahine ka byaaj hamesha 30 dinon se divide hota hai — chahe mahina kitne bhi dinon ka ho.
  </p>

</div><!-- /wrap -->

<script>
'use strict';

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let mode = 'date';
let lastResult = null;

/* ═══════════════════════════════════════════════════
   MODE TOGGLE
═══════════════════════════════════════════════════ */
function setMode(m) {
  mode = m;
  toggle('tb-date', m === 'date');
  toggle('tb-days', m === 'days');
  toggle('sec-date', m === 'date', 'on');
  toggle('sec-days', m === 'days', 'on');
  clearAllErr();
}

function toggle(id, state, cls = 'on') {
  document.getElementById(id).classList.toggle(cls, state);
}

/* ═══════════════════════════════════════════════════
   TODAY BUTTON
═══════════════════════════════════════════════════ */
function setToday() {
  const t = new Date();
  const y  = t.getFullYear();
  const mo = String(t.getMonth() + 1).padStart(2, '0');
  const d  = String(t.getDate()).padStart(2, '0');
  document.getElementById('i-ed').value = `${y}-${mo}-${d}`;
  clrErr('e-ed', 'i-ed');
}

/* ═══════════════════════════════════════════════════
   ERROR HELPERS
═══════════════════════════════════════════════════ */
function setErr(eId, iId, msg) {
  const e = document.getElementById(eId);
  e.textContent = msg;
  e.classList.add('on');
  if (iId) document.getElementById(iId).classList.add('err');
}
function clrErr(eId, iId) {
  const e = document.getElementById(eId);
  if (e) { e.textContent = ''; e.classList.remove('on'); }
  if (iId) {
    const inp = document.getElementById(iId);
    if (inp) inp.classList.remove('err');
  }
}
function clearAllErr() {
  [['e-amt','i-amt'],['e-rate','i-rate'],
   ['e-sd','i-sd'],['e-ed','i-ed'],
   ['e-days','i-days']
  ].forEach(([e, i]) => clrErr(e, i));
}

/* ═══════════════════════════════════════════════════
   INDIAN CURRENCY FORMATTER
   Rules: last 3 digits grouped, then every 2 digits.
   Examples: ₹25,000 | ₹1,25,000 | ₹10,00,000
═══════════════════════════════════════════════════ */
function ic(amount) {
  if (amount == null || isNaN(amount)) return '₹0';

  const neg = amount < 0;
  // Use toFixed(2) on the absolute value — avoids floating-point display issues
  const numStr = Math.abs(amount).toFixed(2);
  const [intS, decS] = numStr.split('.');

  // Build Indian grouped integer
  let fmt;
  if (intS.length <= 3) {
    fmt = intS;
  } else {
    const last3  = intS.slice(-3);
    let   rest   = intS.slice(0, -3);
    const groups = [];
    while (rest.length > 2) {
      groups.unshift(rest.slice(-2));
      rest = rest.slice(0, -2);
    }
    if (rest) groups.unshift(rest);
    fmt = groups.join(',') + ',' + last3;
  }

  const prefix = neg ? '-₹' : '₹';
  // Omit ".00" — show decimals only when non-zero
  return prefix + fmt + (decS === '00' ? '' : '.' + decS);
}

/* ═══════════════════════════════════════════════════
   DATE HELPERS
═══════════════════════════════════════════════════ */
/**
 * Returns exact calendar days between two 'YYYY-MM-DD' strings.
 * Uses Math.round to handle DST transitions (±1 hour).
 * JavaScript Date automatically handles leap years.
 */
function daysBetween(startStr, endStr) {
  const s = new Date(startStr + 'T00:00:00');
  const e = new Date(endStr   + 'T00:00:00');
  return Math.round((e - s) / 86_400_000);
}

/** Convert 'YYYY-MM-DD' → 'DD-MM-YYYY' for display */
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${d}-${m}-${y}`;
}

/** Human-readable period for display only (uses 30 days = 1 month) */
function humanPeriod(totalDays) {
  const d = Math.round(totalDays);
  if (d < 30) return `${d} Din`;
  const months = Math.floor(d / 30);
  const rem    = d % 30;
  if (rem === 0) return `${months} Mahina`;
  return `${months} Mahina ${rem} Din`;
}

/* ═══════════════════════════════════════════════════
   MAIN CALCULATION
═══════════════════════════════════════════════════ */
function doCalc() {
  clearAllErr();
  let ok = true;

  /* ── Validate Amount ── */
  const aRaw = document.getElementById('i-amt').value.trim().replace(/,/g, '');
  const amt  = parseFloat(aRaw);
  if (!aRaw) {
    setErr('e-amt','i-amt','Rashi daalein — Please enter the amount.');
    ok = false;
  } else if (isNaN(amt) || amt <= 0) {
    setErr('e-amt','i-amt','Rashi 0 se zyada honi chahiye — Amount must be greater than 0.');
    ok = false;
  }

  /* ── Validate Rate ── */
  const rRaw = document.getElementById('i-rate').value.trim();
  const rate = parseFloat(rRaw);
  if (!rRaw) {
    setErr('e-rate','i-rate','Byaaj daalein — Please enter the monthly interest rate.');
    ok = false;
  } else if (isNaN(rate) || rate < 0) {
    setErr('e-rate','i-rate','Byaaj negative nahi ho sakta — Interest rate cannot be negative.');
    ok = false;
  }

  /* ── Validate Period ── */
  let days = 0, sDate = '', eDate = '';

  if (mode === 'date') {
    sDate = document.getElementById('i-sd').value;
    eDate = document.getElementById('i-ed').value;
    if (!sDate) {
      setErr('e-sd','i-sd','Shuru ki tarikh chunein — Please select the start date.');
      ok = false;
    }
    if (!eDate) {
      setErr('e-ed','i-ed','Aakhri tarikh chunein — Please select the end date.');
      ok = false;
    }
    if (ok && sDate && eDate) {
      const d = daysBetween(sDate, eDate);
      if (d < 0) {
        setErr('e-ed','i-ed','End date shuru ki date se pehle nahi ho sakti — End date cannot be before start date.');
        ok = false;
      } else if (d === 0) {
        setErr('e-ed','i-ed','Dono tarikhein ek hi hain — Dates must be different.');
        ok = false;
      } else {
        days = d;
      }
    }
  } else {
    const dRaw = document.getElementById('i-days').value.trim();
    const d    = parseFloat(dRaw);
    if (!dRaw) {
      setErr('e-days','i-days','Total din daalein — Please enter the total number of days.');
      ok = false;
    } else if (isNaN(d) || d <= 0) {
      setErr('e-days','i-days','Din 0 se zyada hone chahiye — Days must be greater than 0.');
      ok = false;
    } else {
      days = d;
    }
  }

  if (!ok) return;

  /* ── Core Formula ──────────────────────────────────────
     Monthly Interest = Principal × Rate / 100
     Daily Interest   = Monthly Interest ÷ 30   (ALWAYS 30 — not actual month length)
     Total Interest   = Daily Interest × actualDays
     Total Amount     = Principal + Total Interest
  ──────────────────────────────────────────────────── */
  const monthlyInt = (amt * rate) / 100;
  const dailyInt   = monthlyInt / 30;       // full precision kept
  const totalInt   = dailyInt * days;       // full precision kept
  const totalAmt   = amt + totalInt;

  lastResult = { amt, rate, days, monthlyInt, dailyInt, totalInt, totalAmt, sDate, eDate };

  /* ── Populate hero ── */
  document.getElementById('r-total').textContent = ic(totalAmt);

  /* ── Build result grid ── */
  const isDateMode = mode === 'date';
  let g = `
    <div class="ri">
      <div class="rl">Udhaar Ki Rashi</div>
      <div class="rv">${ic(amt)}</div>
    </div>
    <div class="ri">
      <div class="rl">Mahine Ka Byaaj</div>
      <div class="rv">${rate}%</div>
    </div>`;

  if (isDateMode) {
    g += `
    <div class="ri">
      <div class="rl">Shuru Ki Date</div>
      <div class="rv">${fmtDate(sDate)}</div>
    </div>
    <div class="ri">
      <div class="rl">Aakhri Date</div>
      <div class="rv">${fmtDate(eDate)}</div>
    </div>
    <div class="ri">
      <div class="rl">Total Din (Exact)</div>
      <div class="rv">${days} Din</div>
    </div>
    <div class="ri">
      <div class="rl">Samay / Period</div>
      <div class="rv">${humanPeriod(days)}</div>
    </div>`;
  } else {
    g += `
    <div class="ri full">
      <div class="rl">Total Udhaar Din</div>
      <div class="rv">${days} Din</div>
    </div>`;
  }

  g += `
    <div class="ri">
      <div class="rl">1 Mahine Ka Byaaj</div>
      <div class="rv">${ic(monthlyInt)}</div>
    </div>
    <div class="ri">
      <div class="rl">1 Din Ka Byaaj</div>
      <div class="rv">${ic(dailyInt)}</div>
    </div>
    <div class="ri full hi">
      <div class="rl">Kul Byaaj / Total Interest</div>
      <div class="rv">${ic(totalInt)}</div>
    </div>`;

  document.getElementById('r-grid').innerHTML = g;

  /* ── Breakdown ── */
  document.getElementById('r-bkd').innerHTML =
    `<strong>${ic(amt)} × ${rate}%</strong> = <strong>${ic(monthlyInt)}</strong> &nbsp;(Monthly Interest)<br>` +
    `<strong>${ic(monthlyInt)} ÷ 30</strong> = <strong>${ic(dailyInt)}</strong> &nbsp;(Daily Interest)<br>` +
    `<strong>${ic(dailyInt)} × ${days} din</strong> = <strong>${ic(totalInt)}</strong> &nbsp;(Total Byaaj)<br>` +
    `<strong>${ic(amt)} + ${ic(totalInt)}</strong> = <strong>${ic(totalAmt)}</strong> &nbsp;(Total Rashi)`;

  /* ── Show results ── */
  const rc = document.getElementById('res-card');
  rc.classList.add('on');
  resetCopyBtn();

  // Smooth scroll to results
  setTimeout(() => rc.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
}

/* ═══════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════ */
function doReset() {
  ['i-amt','i-rate','i-sd','i-ed','i-days'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  clearAllErr();
  setMode('date');
  document.getElementById('res-card').classList.remove('on');
  lastResult = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═══════════════════════════════════════════════════
   COPY RESULT
═══════════════════════════════════════════════════ */
function buildCopyText() {
  if (!lastResult) return '';
  const { amt, rate, days, monthlyInt, dailyInt, totalInt, totalAmt, sDate, eDate } = lastResult;

  const lines = [
    '*Byaaj Ka Hisab / Interest Calculation*',
    '',
    `Udhaar Ki Rashi: ${ic(amt)}`,
    `Mahine Ka Byaaj: ${rate}%`,
  ];
  if (mode === 'date') {
    lines.push(`Shuru Ki Tarikh: ${fmtDate(sDate)}`);
    lines.push(`Aakhri Tarikh:   ${fmtDate(eDate)}`);
  }
  lines.push(`Total Din: ${days} Din`);
  lines.push('');
  lines.push(`1 Mahine Ka Byaaj: ${ic(monthlyInt)}`);
  lines.push(`1 Din Ka Byaaj:    ${ic(dailyInt)}`);
  lines.push(`Kul Byaaj:         ${ic(totalInt)}`);
  lines.push('');
  lines.push(`*Total Rashi Leni Hai: ${ic(totalAmt)}*`);
  return lines.join('\n');
}

function doCopy() {
  if (!lastResult) return;
  const text = buildCopyText();
  const onSuccess = () => {
    const btn = document.getElementById('btn-copy');
    btn.classList.add('done');
    document.getElementById('cp-icon').textContent = '✓';
    document.getElementById('cp-txt').textContent  = 'Copy Ho Gaya! WhatsApp pe bhejein ✓';
    setTimeout(resetCopyBtn, 3500);
  };

  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
  } else {
    fallbackCopy(text, onSuccess);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  Object.assign(ta.style, {
    position: 'fixed', left: '-9999px', top: '-9999px', opacity: '0'
  });
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { if (document.execCommand('copy')) cb(); }
  catch { alert('Copy nahi ho saka. Please manually copy karein.'); }
  document.body.removeChild(ta);
}

function resetCopyBtn() {
  document.getElementById('btn-copy').classList.remove('done');
  document.getElementById('cp-icon').textContent = '📋';
  document.getElementById('cp-txt').textContent  = 'WhatsApp / SMS ke liye Copy Karen';
}
</script>
